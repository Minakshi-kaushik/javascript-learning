<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .subscribe-button{
            border: none;
            background-color: black;    
            color: white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left:15px;
            padding-right: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom:30px;
        }

        .is-subscribed{
            background-color: rgb(240, 240, 240);
            color: black;
        }
        
        .cost-input{
            font-size: 15px;
            padding:10px;
        }
        
        .calculate-button{
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <p>YouTube Subscribe Button</p>

    <button class = "js-subscribe subscribe-button" onclick = "
        subscribe()
    ">Subscribe</button>


    <p>Amazon Shipping Calculator</p>
    <p>Order under $40 = +$10 shipping</p>
    <p>Order over $40 = Free shipping</p>

    <input placeholder = "Cost of Product" class = "js-cost cost-input " onkeydown = "
        handleKeyDown(event);
    ">

    <button class="calculate-button" onClick = "
        calculateShipping();
    ">Calculate</button>
    <p class = "js-total-cost"></p>
    
    <script>


        function handleKeyDown(event){
            if(event.key === 'Enter'){
                calculateShipping();
            }
        }

        function calculateShipping(){
            const inputElement = document.querySelector('.js-cost');
            let cost = Number(inputElement.value);

            if(cost < 40){
                document.querySelector('.js-total-cost').innerHTML = `Total Cost: $${cost + 10}`;
            }else{
                document.querySelector('.js-total-cost').innerHTML = `Total Cost: $${cost}`;
            }
        }

        function subscribe(){
             const buttonElement = document.querySelector('.js-subscribe');

            if(buttonElement.innerText === 'Subscribe'){
                buttonElement.innerText = 'Subscribed';
                buttonElement.classList.add('is-subscribed');
            }else{
                buttonElement.innerText = 'Subscribe';
                buttonElement.classList.remove('is-subscribed');
            }

        }

    </script>

</body>
</html>
