<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button id="rock" onclick="
      palyGame('Rock');
    ">Rock</button>


    <button id = "paper" onclick="

      playGame('Paper');
    ">Paper</button>


    <button id = "scissors" onclick = "
      playGame('Scissors');
    ">Scissors</button>


    <script>

      function playGame(playerMove){
        const compMove = pickComputerMove();

      let result = '';

      if(playerMove === 'Scissors'){
            if(compMove === 'Rock'){
            result = 'Lose';
          }else if(compMove === 'Paper'){
            result = 'You win';
          }else if(compMove === 'Scissors'){
            result = 'Tie';
          }
      }else if(playerMove === 'Paper'){
            if(compMove === 'Rock'){
            result = 'Win';
          }else if(compMove === 'Paper'){
            result = 'Tie';
          }else if(compMove === 'Scissors'){
            result = 'Lose';
          }
      }else if(playerMove === 'ROck'){
          if(compMove === 'Rock'){
          result = 'Tie';
        }else if(compMove === 'Paper'){
          result = 'You Lose';
        }else if(compMove === 'Scissors'){
          result = 'You win';
        }
      }

      
      alert(`You picked ${playerMove}, computer picked ${compMove}. Result: ${result}`);

      };


      // golbal variable to store computer move
    

      function pickComputerMove(){
        const randomNumber = Math.random();
        let compMove = ' ';
       

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        compMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
         compMove = 'Paper';
      } else {
         compMove = 'Scissors';
      }

      console.log('Computer Move: ' + compMove);
      return compMove;
      }
    </script>
</body>
</html>
