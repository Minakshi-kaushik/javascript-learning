<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button id="rock" onclick="
      playGame('Rock');
    ">Rock</button>


    <button id = "paper" onclick="

      playGame('Paper');
    ">Paper</button>


    <button id = "scissors" onclick = "
      playGame('Scissors');
    ">Scissors</button>


    <button onclick = ' 
    score.wins = 0; score.losses = 0; score.ties = 0;
    localStorage.removeItem("score");'
    >Reset Score
    </button>


    <script>

      const score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      function playGame(playerMove){
        const compMove = pickComputerMove();

      let result = '';

      if(playerMove === 'Scissors'){
            if(compMove === 'Rock'){
            result = 'You Lose';
          }else if(compMove === 'Paper'){
            result = 'You Win';
          }else if(compMove === 'Scissors'){
            result = 'Tie';
          }
      }else if(playerMove === 'Paper'){
            if(compMove === 'Rock'){
            result = 'You Win';
          }else if(compMove === 'Paper'){
            result = 'Tie';
          }else if(compMove === 'Scissors'){
            result = 'You Lose';
          }
      }else if(playerMove === 'Rock'){
          if(compMove === 'Rock'){
          result = 'Tie';
        }else if(compMove === 'Paper'){
          result = 'You Lose';
        }else if(compMove === 'Scissors'){
          result = 'You Win';
        }
      }

      if(result === 'You Win'){
        score.wins += 1;
      }else if(result === 'You Lose'){
        score.losses += 1;
      }else if(result === 'Tie'){
        score.ties +=1;
      }

      localStorage.setItem('score', JSON.stringify(score));

      alert(`You picked ${playerMove}. Computer picked ${compMove}. Result: ${result}
 Wins: ${score.wins}, Loses: ${score.losses}, Ties: ${score.ties}`);

      };

      

      
      // golbal variable to store computer move
    

      function pickComputerMove(){
        const randomNumber = Math.random();
        let compMove = ' ';
       

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        compMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
         compMove = 'Paper';
      } else {
         compMove = 'Scissors';
      }

      console.log('Computer Move: ' + compMove);
      return compMove;
      }
    </script>
</body>
</html>
